name: Build Windows EXE và Bộ cài đặt

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "GCode-Vision" `
            --icon "assets\logo.ico" `
            run.py

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCode-Vision-portable-exe
          path: dist/GCode-Vision.exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_scripts\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCode-Vision-installer
          path: installer_output/*.exe
